[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-filter"
version = "1.0.0"
description = "A modern Python library and interactive app for Guided Image Filtering (He et al. TPAMI 2012)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Devtanu Barman" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.3.0",
    "streamlit>=1.0.0",
]

[project.scripts]
guided-filter-cli = "main:main"
